name: CI and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  supabase:
    # Pushes database migrations and the referee Edge Function, so the server always runs
    # the same engine as the web build. Skips itself until the secrets are set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: miyplubvsjgqhbkpixqy
      # Session pooler (IPv4). GitHub runners have no IPv6, which the direct database host needs.
      DB_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Supabase secrets are not set, skipping backend deploy."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.secrets.outputs.ready == 'true'
        run: node scripts/sync-functions.mjs
      - if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.secrets.outputs.ready == 'true'
        name: Push database migrations
        run: |
          password=$(node -e "process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))")
          echo "::add-mask::$password"
          supabase db push --db-url "postgresql://postgres.${PROJECT_REF}:${password}@${DB_POOLER_HOST}:5432/postgres"
      - if: steps.secrets.outputs.ready == 'true'
        # Deploys every function in supabase/functions (folders starting with _ are shared code).
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
